name: Prepare portable Linux runtime
description: Install builder prerequisites and reuse the locked glibc 2.35 runtime and corresponding sources.
runs:
  using: composite
  steps:
    - name: Install build dependencies (not needed on target machines)
      shell: bash
      run: |
        awk '$1 == "deb" { $1="deb-src"; print }' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/fairway-sources.list > /dev/null
        # Hosted runners retain PGDG libpq packages but remove their repository
        # and key. Enable only source indexes; do not change binary selection.
        # The archive keeps the exact installed versions after live updates.
        sudo install -d -m 0755 /etc/apt/keyrings
        curl --fail --silent --show-error --location --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/fairway-postgresql.asc > /dev/null
        sudo chmod 0644 /etc/apt/keyrings/fairway-postgresql.asc
        cat <<'EOF' | sudo tee /etc/apt/sources.list.d/fairway-postgresql.list > /dev/null
        deb-src [signed-by=/etc/apt/keyrings/fairway-postgresql.asc] https://apt.postgresql.org/pub/repos/apt/ jammy-pgdg main
        deb-src [signed-by=/etc/apt/keyrings/fairway-postgresql.asc] https://apt-archive.postgresql.org/pub/repos/apt/ jammy-pgdg-archive main
        EOF
        sudo apt-get update
        # Refresh liblzma through its development package and explicitly refresh
        # MySQL's libudev dependency. Hosted images can retain obsolete versions
        # whose exact sources have disappeared from the current Ubuntu indexes.
        sudo apt-get install -y build-essential autoconf bison re2c pkg-config patchelf libxml2-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev libpq-dev libldap2-dev libonig-dev libzip-dev libsodium-dev libicu-dev libpng-dev libjpeg-dev libwebp-dev libfreetype6-dev libpcre2-dev liblzma-dev zlib1g-dev libaio1 libnuma1 libncurses5 libudev1
        # Check these runner-sensitive libraries before the expensive PHP build.
        for library in libpq5 liblzma5 libudev1; do
          library_source=$(dpkg-query -W -f='${source:Package}=${source:Version}' "$library")
          apt-get source --print-uris --only-source "$library_source"
        done
    - uses: actions/cache/restore@v5
      id: runtime
      with:
        path: |
          src-tauri/resources/runtime
          .runtime-work/linux-sources
        key: linux-glibc235-v3-${{ hashFiles('runtime-linux-downloads.lock.json', 'runtime-manifest.json', 'THIRD_PARTY_NOTICES.md', 'scripts/prepare_runtime.py', 'scripts/prepare_linux_runtime.py', 'scripts/fnm_sources.py', '.github/actions/prepare-linux-runtime/action.yml') }}
    - name: Build locked runtime on cache miss
      if: steps.runtime.outputs.cache-hit != 'true'
      shell: bash
      run: python scripts/prepare_runtime.py --lockfile runtime-linux-downloads.lock.json
    - name: Verify staged runtime, including cache hits
      shell: bash
      run: python scripts/prepare_runtime.py --verify-only
    - uses: actions/cache/save@v5
      if: github.ref_type != 'tag' && steps.runtime.outputs.cache-hit != 'true'
      with:
        path: |
          src-tauri/resources/runtime
          .runtime-work/linux-sources
        key: ${{ steps.runtime.outputs.cache-primary-key }}
