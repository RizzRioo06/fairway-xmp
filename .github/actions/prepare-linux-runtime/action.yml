name: Prepare portable Linux runtime
description: Install builder prerequisites and reuse the locked glibc 2.35 runtime and corresponding sources.
runs:
  using: composite
  steps:
    - name: Install build dependencies (not needed on target machines)
      shell: bash
      run: |
        awk '$1 == "deb" { $1="deb-src"; print }' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/fairway-sources.list > /dev/null
        sudo apt-get update
        # Refresh liblzma with its development package so bundled libraries and
        # their exact source versions are both available in the enabled archive.
        sudo apt-get install -y build-essential autoconf bison re2c pkg-config patchelf libxml2-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev libonig-dev libzip-dev libsodium-dev libicu-dev libpng-dev libjpeg-dev libwebp-dev libfreetype6-dev libpcre2-dev liblzma-dev zlib1g-dev libaio1 libnuma1 libncurses5
    - uses: actions/cache/restore@v5
      id: runtime
      with:
        path: |
          src-tauri/resources/runtime
          .runtime-work/linux-sources
        key: linux-glibc235-v2-${{ hashFiles('runtime-linux-downloads.lock.json', 'runtime-manifest.json', 'THIRD_PARTY_NOTICES.md', 'scripts/prepare_runtime.py', 'scripts/prepare_linux_runtime.py', '.github/actions/prepare-linux-runtime/action.yml') }}
    - name: Build locked runtime on cache miss
      if: steps.runtime.outputs.cache-hit != 'true'
      shell: bash
      run: python scripts/prepare_runtime.py --lockfile runtime-linux-downloads.lock.json
    - name: Verify staged runtime, including cache hits
      shell: bash
      run: python scripts/prepare_runtime.py --verify-only
    - uses: actions/cache/save@v5
      if: github.ref_type != 'tag' && steps.runtime.outputs.cache-hit != 'true'
      with:
        path: |
          src-tauri/resources/runtime
          .runtime-work/linux-sources
        key: ${{ steps.runtime.outputs.cache-primary-key }}
