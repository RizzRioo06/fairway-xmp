name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ['candidate-*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/release_candidate.py version
  ui:
    needs: identity
    uses: ./.github/workflows/ui-review.yml
  windows:
    needs: identity
    uses: ./.github/workflows/windows-test-build.yml
    with:
      signed_release: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  macos:
    needs: identity
    uses: ./.github/workflows/macos-test-build.yml
    with:
      signed_release: true
    secrets:
      APPLE_CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12 }}
      APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  linux:
    needs: identity
    uses: ./.github/workflows/linux-test-build.yml
  manifest:
    needs: [ui, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: candidate-metadata-*
          path: artifacts/candidate-metadata
          merge-multiple: true
      - name: Verify identity and assemble the candidate manifest
        run: python scripts/release_candidate.py assemble --require-updater --inputs artifacts/candidate-metadata --output artifacts/release-candidate/candidate-manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: candidate-acceptance-${{ github.sha }}
          path: artifacts/release-candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Report the completed candidate
        run: |
          echo "All platform builds, runtime/restore checks, installer lifecycles and browser checks passed for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "The candidate is ready for publication when the release owner authorizes it. Dispatch Publish tested release with this run ID, commit, version tag and release notes. No device acceptance record is required. This workflow only builds and verifies artifacts; it does not publish a release." >> "$GITHUB_STEP_SUMMARY"
