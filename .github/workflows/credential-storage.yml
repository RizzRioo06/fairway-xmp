name: Verify saved credential storage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/src/postgresql/profiles*'
      - 'src-tauri/src/postgresql/profiles/**'
      - 'src-tauri/src/postgresql/explorer_contract.rs'
      - '.github/workflows/credential-storage.yml'

permissions:
  contents: read

jobs:
  profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tests inject credential APIs/memory vaults and use disposable metadata.
      # They never create real account credentials, services or GUI sessions.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features terminal --locked --lib postgresql::profiles
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features terminal --locked --lib --tests -- -D warnings
