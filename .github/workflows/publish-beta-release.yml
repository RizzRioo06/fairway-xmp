name: Publish tested release

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful release-candidate run ID
        required: true
        type: string
      candidate_commit:
        description: Exact tested source commit (40 characters)
        required: true
        type: string
      tag:
        description: Existing version tag at that commit (for example v0.1.0-rc.1)
        required: true
        type: string
      notes_file:
        description: Reviewed release-notes path in this checkout
        required: true
        type: string
      acceptance_file:
        description: Pre-publication acceptance JSON path (RC/stable required; human update check follows publication)
        required: false
        type: string
      promote_updates:
        description: Offer this release in-app; then record the human update/restart check
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile signature verifier with read-only repository permissions
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --example verify_update --locked
      - uses: actions/upload-artifact@v6
        with:
          name: publication-signature-verifier
          path: src-tauri/target/debug/examples/verify_update
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: prepare-verifier
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: publication-signature-verifier
          path: artifacts/publication-verifier
      - run: chmod +x artifacts/publication-verifier/verify_update
      - name: Publish exact tested release artifacts
        env:
          FAIRWAY_UPDATE_VERIFIER: ${{ github.workspace }}/artifacts/publication-verifier/verify_update
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAIRWAY_RUN_ID: ${{ inputs.candidate_run }}
          FAIRWAY_TAG: ${{ inputs.tag }}
          FAIRWAY_SHA: ${{ inputs.candidate_commit }}
          FAIRWAY_NOTES: ${{ inputs.notes_file }}
          FAIRWAY_ACCEPTANCE: ${{ inputs.acceptance_file }}
        run: python scripts/publish_release.py
      - name: Promote update feed after publishing versioned assets
        if: inputs.promote_updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAIRWAY_TAG: ${{ inputs.tag }}
        run: python scripts/publish_release_feed.py
