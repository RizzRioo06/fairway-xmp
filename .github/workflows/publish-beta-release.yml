name: Publish tested beta

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful release-candidate run ID
        required: true
        type: string
      candidate_commit:
        description: Exact tested source commit (40 characters)
        required: true
        type: string
      tag:
        description: Existing tag identifying that commit (v0.1.0-beta.3)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Publish exact tested beta artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAIRWAY_RUN_ID: ${{ inputs.candidate_run }}
          FAIRWAY_TAG: ${{ inputs.tag }}
          FAIRWAY_SHA: ${{ inputs.candidate_commit }}
          FAIRWAY_NOTES: releases/beta3-notes.md
        run: python scripts/publish_beta_release.py
      - name: Promote update feed after publishing versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAIRWAY_TAG: ${{ inputs.tag }}
        run: python scripts/publish_beta_feed.py
