name: Publish unsigned beta 2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Upload the tested candidate artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAIRWAY_RUN_ID: '38848919567'
          FAIRWAY_TAG: v0.1.0-beta.2
          FAIRWAY_SHA: 764bccae0287af74cca0382359ab3de7853c5f48
          FAIRWAY_NOTES: releases/beta2-notes.md
        run: python scripts/publish_unsigned_release.py
