name: Build and verify Fairway XMP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      warm_inputs:
        description: Also warm runtime inputs and release dependencies on this ref
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  warm-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.warm_inputs
    uses: ./.github/workflows/warm-build-cache.yml

  ui-review:
    uses: ./.github/workflows/ui-review.yml

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:scripts
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features terminal --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
